pre-commit:
  parallel: true
  commands:
    format-lint:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec prettier --write {staged_files} && pnpm exec biome lint --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    go-fmt-lint:
      root: "apps/backend/"
      glob: "*.go"
      run: gofmt -l . | (! grep .) && golangci-lint run ./...
pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    go-test:
      root: "apps/backend/"
      # DB tests use the isolated rps_test (scripts/test-db.sh) and SKIP if it doesn't exist — never DATABASE_URL/rps.
      run: TEST_DATABASE_URL=postgres://rps_dev:rps_dev_password@localhost:5433/rps_test?sslmode=disable go test ./...
